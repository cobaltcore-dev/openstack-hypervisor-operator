apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openstack-hypervisor-operator.fullname" . }}-secret
  labels:
  {{- include "openstack-hypervisor-operator.labels" . | nindent 4 }}
data:
  SERVICE_USERNAME: {{ .Values.secret.serviceUsername | default .Values.controllerManager.manager.env.osUsername
    | required "secret.serviceUsername or controllerManager.manager.env.osUsername is required" | b64enc | quote }}
  SERVICE_PASSWORD: {{ .Values.secret.servicePassword | required "secret.servicePassword is required" | b64enc | quote }}
type: Opaque
